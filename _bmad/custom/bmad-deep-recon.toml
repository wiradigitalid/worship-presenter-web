# This skill ships with `persistent_facts = []`, so unlike 41 other skills it does not
# pick up project context on its own. This file closes that gap; without it, research before G1
# runs without the repo's vocabulary and rules, and the output uses terms that are not in the Glossary.

[workflow]

persistent_facts = [
  "file:{project-root}/.control/product-glossary.md",
  "Research reports land in _bmad-output/ and stay there forever. They MUST NOT be promoted into .what/ and MUST NOT be merged into the brief or a PRD; a `DEC-` and a PRD cite them by path. The run folder MUST NOT be deleted — an Update intent rereads it as original inputs.",
  "Domain terms MUST use the Glossary entry as written. A new term that appears from research MUST be proposed as a Glossary entry, not used in silence.",
]
