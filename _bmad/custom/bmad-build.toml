# G5 — the only executor, and wdi-build is what dispatches it. The executor MUST NOT assemble
# the chain itself.
#
# Supplies the test-first discipline that bmad-build does not have: it audits tests AFTER
# implementation (Matrix Test Audit in step-03), but never requires a test to fail first.
#
# Merge rule: strings replace, lists append, tables merge by key.
# .claude/skills/bmad-build/customize.toml MUST NOT be edited — it is overwritten on every update.

[workflow]

# Replaces the stock step-03 handoff. Everything the stock brings remains (subagent with no
# conversation context, spec as the sole source of truth, load `context:` files, closing
# report); the test-first cycle is what this override adds.
#
# Deliberately holds METHOD only. Restating goals, file lists, acceptance criteria, and
# house style MUST NOT enter the dispatch — they already live in the spec, and step-03
# forbids duplicating them here.

implementation_handoff = """
Launch a subagent with no prior conversation context, with this prompt:

> Read {spec_file} fully and implement it — the spec is the sole source of truth. Load every file listed in its frontmatter `context:` before you start.
>
> Work test-first, one task at a time:
>
> 1. Write the smallest test that expresses the next unmet acceptance criterion.
> 2. Run it. Confirm it fails, and confirm it fails for the reason you expect — a test that errors on a typo or a missing import has proven nothing.
> 3. Write the minimum code that makes it pass. No extra scope, no "while I'm here" refactoring.
> 4. Run the test plus the surrounding suite. Both must be green before you start the next task.
>
> If a criterion genuinely cannot be expressed as a test — pure configuration, a docs change, a visual-only tweak — say so explicitly in your report and state how you verified it instead. Never invent a test that asserts nothing in order to satisfy the cycle, and never write the implementation first and the test afterwards to make it look followed.
>
> When done, report what you changed, how you verified it, and anything left incomplete or risky. Include the actual command output for the final test run — a claim of green without the output does not count as verification.
"""

persistent_facts = [
  "This repo runs in stories mode. sprint-status.yaml does not exist and MUST NOT be created; story status lives in the story file frontmatter.",
  "A Logical Component MUST be registered in components.yaml before a story that touches it is worked.",
  "When something is broken and the cause is not yet known, wdi-systematic-debugging MUST run before any fix is proposed.",
]

# Not overridden, and that is deliberate:
#
# - review_layers — the three stock layers (blind-hunter, edge-case-hunter, verification-gap) plus
#   the two-CLI-family Review Panel that bmad-code-review runs afterwards already cover this
#   repo's review need. Adding a fourth layer spends tokens without closing a gap.
#
# - on_complete — registry updates after a story finishes belong to wdi-build and the skill that
#   owns that layer,
#   not bmad-build. Putting them here makes two writers for one file.
#   The story-closing checklist lives in 05-gates.md.
