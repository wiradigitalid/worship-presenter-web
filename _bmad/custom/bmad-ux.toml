# Class B — the path is configurable; per-PC granularity is not.
#
# bmad-ux only knows {project_name} and {date}, not {slug}, so it cannot land itself
# in .how/<pc>/. Its landing zone is made NEUTRAL in _bmad-output/ because its output
# splits two layers: DESIGN.md belongs to .how/, EXPERIENCE.md belongs to .what/. Landing
# first in either is a layer violation that lasts the whole run.

[workflow]

ux_output_path     = "{project-root}/_bmad-output/ux"
run_folder_pattern = "ux"

doc_standards = ["file:{project-root}/.constitution/document/ux-guide.md"]

persistent_facts = [
  "Every memlog.py call MUST use --path {project-root}/.control/memlog/ux.md. --workspace MUST NOT be used.",
  "Working-document prose follows policy.doc_language in .control/registry/index.yaml (English).",
]

on_complete = "Hand landing to wdi-ux: DESIGN.md to .how/<pc>/01-ux/, tokens and base components to .how/_platform/design-system.md, EXPERIENCE.md to .what/<pc>/04-usecases/, each screen registered as an LC ui-screen in components.yaml. MUST NOT place them yourself."
