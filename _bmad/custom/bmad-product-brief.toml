# Class A — writes straight into the corpus.
# Singleton: one product, one brief, across releases. A second product MUST get its own repo.
#
# Invoked through `wdi-problem`, not directly. This override decides where the artifact
# lands; the skill wrapper checks its contents.

[workflow]

brief_template     = "{project-root}/.constitution/document/templates/brief.md"

# run_folder_pattern MUST be constant — no {project_name} and no {date}.
# That forces the singleton: every run lands in the same folder, so a second run
# is detected as resume/update, not a neighbouring folder.
# Result: .what/_product-brief/brief.md and .what/_product-brief/addendum.md;
# those two filenames are hardcoded in SKILL.md and cannot be configured.
brief_output_path  = "{project-root}/.what"
run_folder_pattern = "_product-brief"

# Append-only against the default `skill:bmad-review lenses=structure,prose`.
doc_standards = ["file:{project-root}/.constitution/document/brief-guide.md"]

persistent_facts = [
  "Every memlog.py call — init, append, set, and reads on resume or Update intent — MUST use --path {project-root}/.control/memlog/brief.md. --workspace MUST NOT be used; it would drop .memlog.md inside .what/, and no memlog may live in the corpus.",

  "The brief template opens with permission to drop sections that do not earn their place. That permission MUST NOT apply to the eight required sections: The Problem, Who This Serves, Goals, Success Criteria, Scope In, Scope Out, Constraints, Assumptions — plus Prerequisites. Other template sections MAY be dropped.",

  "Goals MUST be numbered BG-1, BG-2, and so on. MUST NOT be numbered G1, G2 — G1 through G5 are the five gate names in this method, and BG is the first link of the traceability chain BG -> CAP -> FR/NFR -> UC -> Story -> Test.",

  "The Who This Serves table MUST contain exactly one row marked primary, and MUST contain every stakeholder including those who never open the product.",

  "The brief MUST NOT list Product Components and MUST NOT fill product_components or logical_components. Slicing is born at the TAIL of G2 through wdi-init intent `component`, read from the brief plus every PRD.",

  "Research, brainstorming, forge, and PRFAQ output MUST stay in _bmad-output/. It MUST NOT be merged into the brief and MUST NOT be promoted into .what/; a `DEC-` or PRD cites it by path. That run folder MUST NOT be deleted — an Update intent rereads it as original inputs.",

  "Working-document prose follows policy.doc_language in .control/registry/index.yaml (English). Filename slugs follow policy.doc_filename_language (English).",
]
