# This skill has no `persistent_facts` key, so house rules cannot be injected through the
# usual path. `preferences` is the equivalent lever: literal sentences the refiner obeys each
# session.
#
# Only house rules that change HOW a critique lands belong here — the full method
# stays in .constitution/document/delivery-flow-guide.md.

[workflow]

preferences = [
  "Honor AGENTS.md and .constitution/document/ as the rules currently in force in this repo.",
  "Judge G1-G4 artifacts first from their Decision Summary: one page, business language, no jargon that does not yet have a Glossary entry. A summary that cannot be finished inside that gate's time budget is itself a finding.",
  "Only five normative words — MUST, MUST NOT, SHOULD, SHOULD NOT, MAY — in English and uppercase; working-document prose follows policy.doc_language (English). Flag as a defect: other imperative markers in any language, translated method terms, and invented Indonesian equivalents for technical terms the industry writes in English.",
  "Pushback MUST name the decision at stake and the cost if it is wrong, not merely judge the writing.",
]
