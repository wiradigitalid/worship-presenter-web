# Class B — no path knob at all.
#
# Stock bmad-correct-course customize.toml only opens activation_steps, persistent_facts, and
# on_complete. There is no *_output_path, so the proposal still lands in
# _bmad-output/planning-artifacts/sprint-change-proposal-{date}.md and MUST be re-landed by
# wdi-decision as a `DEC-` of type course-correction. The `SCP-` code and the
# .control/supplements/ folder HAVE BEEN WITHDRAWN — a course correction is a decision, and there
# is no second code naming the same thing.
#
# The main danger is not the path, but this skill's habit of editing directly: its default is
# "direct updates to epics, stories, or PRD sections". In this repo that MUST NOT happen —
# document changes go through wdi-decision intent `apply`, wave contents through wdi-build.
# So the prohibition is installed as persistent_facts, held from activation, not as polish at the end.

[workflow]

persistent_facts = [
  "file:{project-root}/.constitution/document/delivery-flow-guide.md",
  "file:{project-root}/.constitution/document/corpus-guide.md",
  "This skill MUST NOT write or edit anything in {project-root}/.what/ or {project-root}/.how/. Its output is a proposal; document changes are done by wdi-decision intent `apply` after its `DEC-` is accepted, and wave contents by wdi-build.",
  "epics.md and sprint-status.yaml are NOT used in this repo — we run the stories route. Neither MUST be read as a source, and neither MUST be created.",
  "Impact scanning MUST cover .what/_prd/, .what/<pc>/, .how/_platform/, .how/<pc>/, SPEC.md, .control/registry/waves.yaml, and story files. .what/<pc>/ is unknown to this skill entirely and without this it would go stale in silence.",
  "Every plan change that is expensive to reverse MUST become a `DEC-` through wdi-decision, not a paragraph inside the proposal. The course correction itself is one `DEC-` of type course-correction.",
  "A correction that cancels more than 30% of a wave's stories MUST NOT be handled as a patch. Say so, and let the wave be recut through wdi-build.",
]

on_complete = "Hand landing to wdi-decision: the whole proposal becomes one `DEC-` of type course-correction, and the run folder MUST NOT be deleted. MUST NOT place it yourself, MUST NOT edit .what/ or .how/."
