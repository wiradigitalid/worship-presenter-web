# Class A — writes straight into the corpus.
#
# One PRD per **initiative / functional area**, not per release. It is a living document:
# behaviour changes enter through an Update intent on the same PRD, not a new PRD.
# Release is carried by the registry via target_release, not by the folder name.
#
# run_folder_pattern MUST be filled with the initiative slug and MUST NOT use {date}.
# When a new initiative is opened, BOTH lines MUST change together:
#   1. run_folder_pattern             -> next initiative slug
#   2. --path .../prd-<slug>.md       -> next initiative memlog
# Changing only one produces a new PRD glued to the old memlog.
#
# The default below is deliberately unusable as-is — it MUST be replaced
# at runbook step 4. A PRD landing in a folder named ISI-slug-inisiatif
# is the sign that step was skipped.

[workflow]

prd_template       = "{project-root}/.constitution/document/templates/prd.md"
prd_output_path    = "{project-root}/.what/_prd"
run_folder_pattern = "ISI-slug-inisiatif"

doc_standards = ["file:{project-root}/.constitution/document/prd-guide.md"]

# Facts below deliberately repeat parts of prd-guide.md. Reason: timing — doc_standards only
# fires at Polish, while Create-versus-Update detection happens at activation.
# The guide remains authoritative; if the two disagree, the guide wins and the rows here
# MUST be fixed.
persistent_facts = [
  "file:{project-root}/.control/registry/requirements.yaml",
  "file:{project-root}/.constitution/document/prd-guide.md",

  "FR-N, NFR-N, UJ-N, and CAP-N MUST be allocated from requirements.yaml and MUST NOT restart from 1. The next initiative PRD continues the previous PRD's series — the series is global, one product one series.",

  "This PRD is a living document. Behaviour changes, closely related feature additions, or promise corrections MUST enter through an Update intent on the same PRD. A new PRD MUST NOT be created only because the release changed; it is created only when the functional area is genuinely different and would be unpleasant to read if merged.",

  "Each Update intent run MUST add exactly one row to the PRD Revision History table: date, what changed in the outside reader's language, and why. That table is for the reader; the memlog is for audit. They MUST NOT replace each other.",

  "A release MUST NOT be stated through the PRD folder name or its title. It is carried by the target_release field in requirements.yaml and waves.yaml. Naming a release number in PRD prose MAY be done as context, but the registry remains binding.",

  "Every memlog.py call — init, append, set, and reads on resume or Update intent — MUST use --path {project-root}/.control/memlog/prd-ISI-slug-inisiatif.md. The slug MUST match run_folder_pattern above, and both lines MUST change together when the initiative changes. --workspace MUST NOT be used.",

  "Working-document prose follows policy.doc_language in .control/registry/index.yaml (English). Filename slugs follow policy.doc_filename_language (English). Method terms, markers, and IDs stay English.",
]
