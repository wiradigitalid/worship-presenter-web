# Runs in stories mode: reads SPEC.md + stories.yaml + stories/<id>-*.md, not
# sprint-status.yaml. Output is RETROSPECTIVE.md inside the spec folder — ephemeral.

[workflow]

persistent_facts = [
  "This repo runs in stories mode. RETROSPECTIVE.md MUST be archived as RTR-<wave> in .control/reports/ by wdi-build before the wave closes. It is REQUIRED on an `L` wave and advisory on `S` and `M` — V19 is bound to wave size, not to `mode`, and skipping it MUST be stated rather than left silent.",
  "Every row of the distillation table in .constitution/document/bmad-guide.md MUST be complete before the wave is declared closed.",
]
