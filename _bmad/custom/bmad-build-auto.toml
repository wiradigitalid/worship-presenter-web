# One iteration of the unattended loop. Dispatch via {spec_folder} + {story_id}.

[workflow]

persistent_facts = [
  "This repo runs in stories mode. sprint-status.yaml does not exist and MUST NOT be created.",
  "Test-first discipline binds: a test MUST fail first, and MUST fail for the expected reason.",
  "A worker MUST NOT change anything outside the dispatched story. A change judged necessary beyond that MUST be stated in the final result, never made in silence.",
  "When a test or build fails and the cause is not yet known, wdi-systematic-debugging MUST run before any fix is proposed. A third failed fix attempt is the sign to stop and report, not to try a fourth.",
]
