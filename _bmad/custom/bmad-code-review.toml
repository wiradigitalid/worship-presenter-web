# Review Panel: two reviewers from two different CLI families, and neither may be the family that
# ran the implementation.
#
# WARNING: adversarial and edge-case lenses here are read from the bundled review-prompts/
# copies, NOT from the bmad-review skill. An override on bmad-review will not show up on this path.

[workflow]

persistent_facts = [
  "file:{project-root}/.constitution/codebase/conventions-guide.md",
  "Findings that repeat across stories MUST be recorded through bmad-project-context intent record, not silently fixed each time they appear.",
]
