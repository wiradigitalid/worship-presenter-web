# Class C — one run per (wave x Product Component), gone after G5.
#
# The slug decides whether a spec is ephemeral or living: the same slug lands in the same folder and
# keeps the capability ID. A per-PC slug alone would make SPEC.md a living document per PC —
# a direct rival of the SRS. The slug w<N>-<pc> keeps the spec ephemeral, and CAP-N stays sound
# because it is allocated from the registry, not from BMad's internal mechanism.

[workflow]

persistent_facts = [
  "The spec slug MUST be shaped w<N>-<pc>, one run per wave x Product Component pair.",
  "SPEC.md MUST NOT hold anything that did not come from the SRS, SDD, or PRD. New findings MUST be landed in the corpus by the skill that owns that layer — ownership table in .constitution/document/corpus-guide.md — before the wave closes, not left sitting in the spec.",
  "CAP-N MUST be allocated from {project-root}/.control/registry/requirements.yaml.",
  "file:{project-root}/.control/product-glossary.md",
  "Working-document prose follows policy.doc_language in .control/registry/index.yaml (English).",
]
