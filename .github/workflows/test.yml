name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - run: go test ./cmd/... ./internal/...

    - run: npm ci

    - run: npm run spa:build

    - run: npm test
