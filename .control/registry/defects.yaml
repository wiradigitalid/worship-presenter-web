      Originally filed as "no way to duplicate/clone a Song Set entry", reasoning the owner wanted
      a new entry to start from an already-configured canvas instead of reconfiguring one from
      scratch. Corrected during this SPEC's review: `AD-33` (2026-08-20, DEC-004) already makes
      every Song Set entry share ONE authored Title/Verse/Reff trio — `SongSetEntry`
      (`SongSetEntriesPanel.tsx`) carries only `variableName`/`title`/`position`/`updatedAt`,
      nothing canvas-related, so there is no per-entry canvas configuration to clone; a new entry
      already gets the exact same shared layout automatically. The owner confirmed, once shown
      this, that the actual problem is the UI's own fault for looking like each entry owns its own
      canvas (matching how Main Spine and Announcement Set slides each own theirs) when it does
      not — that false impression is what produced the original "let me clone it" request. Fix:
      make the shared scope visually unmistakable in the Song Set editor, and reconsider whether
      the entries list and the trio editor should be separated so switching entries does not read
      as switching canvases. See ticket 13
      (`.scratch/SPEC-13-artifacts-qa-followup-round2/issues/13-song-set-shared-trio-clarity.md`).

