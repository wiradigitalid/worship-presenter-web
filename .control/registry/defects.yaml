  - id: BUG-9
    status: fixed
    fixed_in: SPEC-12
    title: "Announcement Set editor shows two stacked title areas, and renaming shifts surrounding layout"
    component: registry
    violates: []
    source: ".work/requirements/prompt-06-artifacts-announcement-sets-qa-followup.md § TITLE AREA, § SLIDES IN SET #2 — owner clarification 2026-09-08 in chat"
    summary: >
      Manual QA (screenshots): the Announcement Set editor renders a title block for the active
      Announcement Set ("[set: Opening Announcement]") immediately above a second, near-identical
      title block for the currently selected slide-in-set ("[general]") — confusing which Rename
      acts on which. Separately, entering rename mode shifts the "Active Announcement Set" label
      and changes the title area's height, pushing the canvas down and back up.

      **Owner clarification (2026-09-08), and this is the load-bearing part:** the two blocks'
      content was identical (same title text top and bottom). The owner edited/saved the TOP block
      first, then tried to edit the BOTTOM block — that second edit is what produced the "Slide was
      modified by another session... discarded" conflict banner previously filed separately as
      OQ-59 (now folded in here and removed from `assumptions.md` — same defect, not a coincidence
      or a separate incidental race). Working theory: the two title blocks are two different UI
      bindings reading/writing what is either the same underlying record, or two records that are
      supposed to stay in sync and do not — saving the top one advances a concurrency token
      (`updatedAt`) that the bottom block's already-fetched copy does not know about, so the second
      save is rejected as stale. This reframes BUG-9 from a cosmetic duplicate-title-area
      complaint into a reproducible edit-conflict bug: confirm via `wdi-systematic-debugging`
      which two things the top and bottom blocks actually read from/write to before deciding
      whether the fix is "delete the duplicate block" or "these are two real things that need one
      shared concurrency token instead of two independent ones."
